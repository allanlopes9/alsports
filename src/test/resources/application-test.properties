spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_TEST_URL:jdbc:postgresql://localhost:5432/alsports_test}
spring.datasource.username=${DB_TEST_USERNAME:alsports_app}
spring.datasource.password=${DB_TEST_PASSWORD}

spring.jpa.show-sql=false
logging.level.liquibase=INFO

# Chave didática exclusiva do profile de testes. Não é segredo de produção.
# Valor Base64 de 33 bytes, suficiente para HS256 (mínimo de 32 bytes).
app.security.jwt.secret=YWxzcG9ydHMtYXVsYTEzLXRlc3RlLWNoYXZlLTMyYiEh