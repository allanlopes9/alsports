databaseChangeLog:
  - changeSet:
      id: 002-create-produto
      author: allan
      changes:
        - createTable:
            tableName: produto
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: nome
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: quantidade
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: preco
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: data_cadastro
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: ativo
                  type: BOOLEAN
                  constraints:
                    nullable: false

              - column:
                  name: categoria_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: unidade_medida
                  type: VARCHAR(30)
                  constraints:
                    nullable: false