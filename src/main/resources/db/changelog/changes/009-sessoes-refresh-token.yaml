databaseChangeLog:
  - changeSet:
      id: 009-01-create-sessao-refresh-token
      author: allan
      comment: >-
        Registra cada geração de refresh token dentro de uma família de sessão.
        Somente o hash SHA-256 do token é persistido; o valor opaco existe
        apenas no fluxo de resposta ao cliente.
      changes:
        - createTable:
            tableName: sessao_refresh_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_sessao_refresh_token
                    nullable: false
              - column:
                  name: conta_acesso_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: familia_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: criada_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: ultima_atividade_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expira_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: utilizada_em
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: revogada_em
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: motivo_revogacao
                  type: VARCHAR(30)
      rollback:
        - dropTable:
            tableName: sessao_refresh_token

  - changeSet:
      id: 009-02-indices-sessao-refresh-token
      author: allan
      comment: >-
        Cria a chave estrangeira e os índices usados na localização por hash e
        na revogação por família ou por conta.
      changes:
        - addForeignKeyConstraint:
            baseTableName: sessao_refresh_token
            baseColumnNames: conta_acesso_id
            referencedTableName: conta_acesso
            referencedColumnNames: id
            constraintName: fk_sessao_refresh_token_conta
            onDelete: CASCADE
            onUpdate: RESTRICT
        - createIndex:
            tableName: sessao_refresh_token
            indexName: idx_sessao_refresh_token_familia
            columns:
              - column:
                  name: familia_id
        - createIndex:
            tableName: sessao_refresh_token
            indexName: idx_sessao_refresh_token_conta
            columns:
              - column:
                  name: conta_acesso_id
        - createIndex:
            tableName: sessao_refresh_token
            indexName: idx_sessao_refresh_token_hash
            columns:
              - column:
                  name: token_hash
      rollback:
        - dropIndex:
            tableName: sessao_refresh_token
            indexName: idx_sessao_refresh_token_hash
        - dropIndex:
            tableName: sessao_refresh_token
            indexName: idx_sessao_refresh_token_conta
        - dropIndex:
            tableName: sessao_refresh_token
            indexName: idx_sessao_refresh_token_familia
        - dropForeignKeyConstraint:
            baseTableName: sessao_refresh_token
            constraintName: fk_sessao_refresh_token_conta

  - changeSet:
      id: 009-03-constraints-sessao-refresh-token
      author: allan
      comment: >-
        Garante hash único, validade coerente e valores de motivo conhecidos.
      changes:
        - addUniqueConstraint:
            tableName: sessao_refresh_token
            columnNames: token_hash
            constraintName: uk_sessao_refresh_token_hash
        - sql:
            sql: >
              ALTER TABLE sessao_refresh_token
              ADD CONSTRAINT ck_sessao_refresh_token_expira_mais_criada
              CHECK (expira_em > criada_em)
        - sql:
            sql: >
              ALTER TABLE sessao_refresh_token
              ADD CONSTRAINT ck_sessao_refresh_token_motivo
              CHECK (motivo_revogacao IS NULL OR motivo_revogacao IN
              ('LOGOUT', 'LOGOUT_GLOBAL', 'INATIVIDADE',
               'EXPIRACAO_ABSOLUTA', 'REUTILIZACAO', 'CONTA_INATIVA'))
      rollback:
        - sql:
            sql: ALTER TABLE sessao_refresh_token DROP CONSTRAINT IF EXISTS ck_sessao_refresh_token_motivo
        - sql:
            sql: ALTER TABLE sessao_refresh_token DROP CONSTRAINT IF EXISTS ck_sessao_refresh_token_expira_mais_criada
        - dropUniqueConstraint:
            tableName: sessao_refresh_token
            constraintName: uk_sessao_refresh_token_hash
