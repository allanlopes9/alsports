databaseChangeLog:
  - changeSet:
      id: 001-01-create-categoria-produto
      author: curso-spring-2026
      comment: Cria a tabela que classifica os produtos.
      changes:
        - createTable:
            tableName: categoria_produto
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categoria_produto
                    nullable: false

              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false

              - column:
                  name: ativo
                  type: BOOLEAN
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: categoria_produto